# Two physically connected transducers, only one of which is actually active at a time --
# initial configuration: slot 0 active (real press), slot 1 off (press: 0). Used by
# standalone_yaml.py in this same folder, which switches which one is active mid-script via
# slot.configure() -- something only Python, not this static file, can express.
#
# See standalone_plain.py (also in this folder) if you want the full, manually-written Python
# equivalent instead, or need something this file's fields don't cover.

driving_sys_serial: IGT-32-ch_comb_2x10-ch  # print(driving_system.get_ds_serials()) for options

protocols:
  - slots:
      # Both transducers are physically connected for the whole session -- slot 0 starts
      # active, slot 1 starts off.
      - transducer_serial: IS_PCD15287_01001  # print(transducer.get_tran_serials()) for options
        focus_option: Focus wrt exit plane [mm]
        focus_value: 40  # [mm], focal depth w.r.t. the exit plane and FWHM middle
        power_option: Max. pressure in free water [MPa]
        power_value: 0.5  # [MPa] -- active
        oper_freq: 300  # [kHz], operating frequency

      - transducer_serial: IS_PCD15287_01002
        focus_option: Focus wrt exit plane [mm]
        focus_value: 80  # [mm], focal depth w.r.t. the exit plane and FWHM middle
        power_option: Max. pressure in free water [MPa]
        power_value: 0  # [MPa] -- off, physically connected but not firing
        oper_freq: 300  # [kHz], operating frequency

    timing:
      pulse_dur: 45             # [ms], pulse duration -- the only required timing field
      pulse_ramp_shape: Rectangular - no ramping
      pulse_rep_int: 100        # [ms], one pulse every 100 ms
      pulse_train_dur: 500      # [ms], pulse train duration -- 5 pulses per train (500 / 100)
      # a new train starts every 1000 ms (500 ms train, then a 500 ms gap before the next)
      pulse_train_rep_int: 1000  # [ms]
      # keeps repeating for 5 s in total, i.e. 5 repetitions of the whole train
      pulse_train_rep_dur: 5    # [s]

      # 'None' (used here) means no trigger at all -- executed directly. 'TriggerOnePulseTrain'
      # fires one pulse train per trigger received (also requires n_triggers);
      # 'TriggerWholeProtocol' fires the entire, already fully-timed protocol at once with a
      # single trigger.
      trigger_option: None

# total_alternating_duration_ms is only needed when protocols above has more than one entry --
# omit it entirely for a single protocol like this one.
