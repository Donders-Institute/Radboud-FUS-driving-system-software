# Protocol for a single Sonic Concepts transducer -- used by standalone_yaml.py in this same
# folder. See standalone_plain.py (also in this folder) if you want the full, manually-written
# Python equivalent instead, or need something this file's fields don't cover.

driving_sys_serial: 105-010  # print(driving_system.get_ds_serials()) for options

# For SC specifically, this is effectively binary -- send_protocol()/execute_protocol() only ever
# check whether a trigger is expected at all, never which kind, so 'TriggerOnePulseTrain' has no
# meaningful effect over 'TriggerWholeProtocol' here. Unlike IGT's own 'TriggerWholeProtocol' (one
# trigger arms every repetition at once), SC's driving system waits for a fresh external trigger
# each time it needs to fire the pulse train. 'None' means no trigger at all -- executed directly.
trigger_option: None

protocols:
  - slots:
      - transducer_serial: CTX-500-026  # print(transducer.get_tran_serials()) for options
        focus_option: Focus wrt exit plane [mm]
        focus_value: 40  # [mm], focal depth

        # SC's only power option -- unlike IGT, no 'Max. pressure in free water [MPa]' choice.
        power_option: Global power [mW]
        power_value: 2.5  # [W] -- power_option's own unit is mW, check your units!

        oper_freq: 500  # [kHz], operating frequency

    timing:
      pulse_dur: 10          # [ms], pulse duration -- the only required timing field
      pulse_ramp_shape: Rectangular - no ramping
      pulse_ramp_dur: 0      # [ms], ramp duration
      pulse_rep_int: 50      # [ms], pulse repetition interval -- one pulse every 50 ms
      pulse_train_dur: 200   # [ms], pulse train duration -- 4 pulses per train (200 / 50)

# total_alternating_duration_ms is only needed when protocols above has more than one entry --
# omit it entirely for a single protocol like this one.
