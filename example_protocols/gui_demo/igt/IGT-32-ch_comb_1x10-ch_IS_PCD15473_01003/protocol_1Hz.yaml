# A ready-to-load demo protocol for fus_ds_gui's Planning tab (File > Load protocol...).
# IGT-32-ch_comb_1x10-ch + IS_PCD15473_01003 are both real, active entries in ds_config.ini, so
# this loads cleanly without needing any hardware connected.

driving_sys_serial: IGT-32-ch_comb_1x10-ch

protocols:
  - slots:
      - transducer_serial: IS_PCD15473_01003
        focus_option: Focus wrt exit plane [mm]
        focus_value: 60  # [mm], focal depth w.r.t. the exit plane and FWHM middle
        power_option: Max. pressure in free water [MPa]
        power_value: 0.3  # [MPa], maximum pressure in free water

    timing:
      pulse_dur: 100          # [ms], pulse duration
      pulse_rep_int: 1000      # [ms], pulse repetition interval: one pulse every 1000 ms
      pulse_train_dur: 1000   # [ms]
      pulse_train_rep_int: 1000  # [ms]
      pulse_train_rep_dur: 120    # [s], keeps repeating for 120 s in total
