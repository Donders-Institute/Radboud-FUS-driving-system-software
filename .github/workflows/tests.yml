name: Tests

"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        working-directory: fus_ds_package
        run: flake8

  test:
    # Windows-only: the package only officially supports Windows (see README),
    # and the igt subpackage depends on a compiled native extension
    # (unifus.pyd) built for Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests (hardware-dependent tests excluded)
        working-directory: fus_ds_package
        run: pytest -m "not hardware"

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: fus_ds_package/htmlcov/
          retention-days: 30
