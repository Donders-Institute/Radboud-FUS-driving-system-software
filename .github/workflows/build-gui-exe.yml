name: Build GUI executable

# Runs on the same v* tags as release-version-check.yml, so every release automatically gets a
# ready-to-run Windows build attached; nobody has to run PyInstaller by hand for a release.
# It can also be started by hand (Actions tab, Run workflow) to build any branch without a
# release: that build is kept as a workflow artifact for 30 days instead of attached to a release.
"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # to attach the build to the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Name the build
        # A tag build is named after the tag, a manual run after the commit.
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $name = $env:GITHUB_REF_NAME } else { $name = "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          "BUILD_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install GUI and build dependencies
        # requirements.txt holds the pins of numpy, pandas, scipy and the rest that the package
        # imports; neither package declares them itself, so PyInstaller only bundles them when
        # they are installed here.
        run: |
          pip install -r requirements.txt
          pip install -r fus_ds_gui/requirements-gui.txt
          pip install -r fus_ds_gui/requirements-build.txt

      - name: Build the executable
        working-directory: fus_ds_gui
        run: pyinstaller fus_ds_gui.spec --noconfirm

      - name: Check the build contains its libraries
        # The build succeeds even when a library is missing; the program then fails at startup.
        # Libraries with compiled parts get a folder; pure Python ones are listed in PyInstaller's
        # warnings when they are missing.
        working-directory: fus_ds_gui
        run: |
          $missing = @('numpy', 'pandas', 'scipy', 'fus_driving_systems/igt/unifus.cp311-win_amd64.pyd') |
            Where-Object { -not (Test-Path "dist/FDS_GUI/_internal/$_") }
          if ($missing) { throw "Missing from the build: $($missing -join ', ')" }
          $unresolved = Select-String -Path build/fus_ds_gui/warn-fus_ds_gui.txt `
            -Pattern 'missing module named (yaml|serial|openpyxl|CTkMessagebox|tkinter)\b.*top-level'
          if ($unresolved) { $unresolved | ForEach-Object { $_.Line }; throw 'Unresolved imports in the build' }

      - name: Zip the build
        # Zips FDS_GUI/*, not the FDS_GUI folder itself: FDS_GUI.exe ends up right at the top
        # of the extracted zip, next to _internal/, not one folder level down.
        working-directory: fus_ds_gui/dist/FDS_GUI
        run: Compress-Archive -Path * -DestinationPath "../FDS_GUI-${{ env.BUILD_NAME }}-windows.zip"

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FDS_GUI-${{ env.BUILD_NAME }}-windows
          path: fus_ds_gui/dist/FDS_GUI-${{ env.BUILD_NAME }}-windows.zip
          retention-days: 30

      - name: Attach the build to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: fus_ds_gui/dist/FDS_GUI-${{ env.BUILD_NAME }}-windows.zip
