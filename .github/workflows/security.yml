name: Security audit

# tests.yml already audits on every push and pull request. This one runs the same audit on a
# schedule, because a pinned version can be reported as vulnerable long after it was pinned.
# It can also be started by hand from the Actions tab.
"on":
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    # Python 3.10 is end of life: some dependencies (pillow) have fixes only for 3.11 and up. That
    # run stays visible but does not fail the workflow.
    continue-on-error: ${{ matrix.python-version == '3.10' }}

    strategy:
      fail-fast: false
      matrix:
        # pip-audit reads the requirement files for the Python that runs it, and what it
        # resolves besides the pins (pillow, for one) differs per version.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known vulnerabilities (fus_ds_package)
        run: pip-audit -r requirements-ci.txt

      - name: Audit dependencies for known vulnerabilities (fus_ds_gui)
        run: pip-audit -r fus_ds_gui/requirements-gui.txt
