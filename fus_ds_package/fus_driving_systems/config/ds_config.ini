[General]
configuration file folder = config
delay before reconnecting [s] = 2
maximum reconnection attempts = 5
package name = fus_driving_systems
speed of sound water [m/s] = 1500

[Logging]
logger name = driving_system
temporary logging path = C:\Temp
filename faulthandler = faulthandler_output.log
filename session pointer = .last_session_log_dir
filename kernel death counter = kernel_death_count.txt
timestamp format = %Y-%m-%d_%H-%M-%S
log level console = INFO
log level file = DEBUG
initial part of log filename = log_
max log file size [mb] = 10

[Trigger]
options = None
	TriggerOnePulseTrain
	TriggerWholeProtocol
default option = None
option.none = None
option.pulse_train = TriggerOnePulseTrain
option.whole_protocol = TriggerWholeProtocol
default n_triggers = 0

[Power]
options = Global power [mW]
	Amplitude [%]
	Max. pressure in free water [MPa]
	Voltage [V]
option.glob_pow = Global power [mW]
option.ampl = Amplitude [%]
option.press = Max. pressure in free water [MPa]
option.volt = Voltage [V]
engineering-only options = Amplitude [%]
	Voltage [V]
; SAFETY LIMIT: only raise this after confirming your hardware and setup can safely
; exceed it. Hand-editing this value is fine, but it will be silently overwritten if
; this file is ever regenerated via create_config.py, or replaced by installing a new
; package release -- keep a copy of your override if you rely on it long-term.
maximum pressure allowed in free water [mpa] = 1.4

[Focus]
options = Focus wrt exit plane [mm]
	Focus wrt mid bowl [mm]
default option = Focus wrt exit plane [mm]
option.exit = Focus wrt exit plane [mm]
option.bowl = Focus wrt mid bowl [mm]
engineering-only options = Focus wrt mid bowl [mm]
default.minimum = 15
default.maximum = 1000

[Ramp]
options = Rectangular - no ramping
	Linear
	Tukey
default option = Rectangular - no ramping
option.rect = Rectangular - no ramping
option.lin = Linear
option.tuk = Tukey

[Timing]
pulse_dur_ms = 0.25
pulse_rep_int_ms = 20
pulse_train_dur_ms = 20
pulse_train_rep_int_ms = 20
pulse_train_rep_dur = 20
pulse_ramp_dur_ms = 0

